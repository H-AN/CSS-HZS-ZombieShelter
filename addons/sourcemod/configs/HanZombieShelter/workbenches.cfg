// v0.8.2 起始可调数值；不代表已经完成实战平衡验收。
// 用户最终要求：合成台必须供电，Lv.1 需求 50，每升级一级增加 30，Lv.10 为 320。
// Types 的组名同时是合成台名称和 required_station_type 的精确匹配值。
// 未指定 required_station_type 的武器绑定 Types 顺序中第一个可用合成台。
"ShelterWorkbenches"
{
    "schema_version" "2"
    "Limits" { "max_per_base" "1" }
    "Types"
    {
        "合成台"
        {
            "enabled" "1"
            "model" "models/props/de_piranesi/pi_sundial.mdl"
            "display_name" "合成台"
            "description" "瞄准已完工的合成台按 E，供电正常时使用武器合成或材料合成。升级可解锁更高等级的武器配方。"
            "model_scale" "1.0"
            "render_rgb" "255 255 255"
            "render_alpha" "255"
            "skin" "0"
            "body" "0"
            "Placement"
            {
                "mode" "upright"
                // Engine bounds minZ=-0.28125; keep the hull clear of its supporting floor.
                "origin_offset" "0 0 0.5"
                "angle_offset" "0 0 0"
                "allow_overlap" "0"
                "max_distance" "512"
            }
            // CS:S 内置模型，无需增加 Downloads 项或外部模型资源包。
            "Sounds" { "build" "" "attack" "" "upgrade" "" "destroy" "" }
            "Growth"
            {
                "max_level" "10"
                "anchor_level" "1"
                "Stats"
                {
                    "max_hp_per_level" "100"
                    "power_required_per_level" "30"
                }
            }
            "Levels"
            {
                "1"
                {
                    "max_hp" "500"
                    "power_required" "50"
                    "power_priority" "25"
                    "max_per_base" "1"
                }
                // upgrade_cost 是升到该等级所需费用，不是该等级的武器合成费用。
                "2" { "upgrade_cost" { "wood" "30" "iron" "10" "copper" "3" } }
                "3" { "upgrade_cost" { "wood" "45" "iron" "20" "copper" "6" } }
                "4" { "upgrade_cost" { "wood" "60" "iron" "30" "copper" "10" "silver" "2" } }
                "5" { "upgrade_cost" { "wood" "80" "iron" "40" "copper" "15" "silver" "4" "gold" "1" } }
                "6" { "upgrade_cost" { "wood" "100" "iron" "55" "copper" "20" "silver" "6" "gold" "2" } }
                "7" { "upgrade_cost" { "wood" "120" "iron" "70" "copper" "25" "silver" "8" "gold" "3" } }
                "8" { "upgrade_cost" { "wood" "140" "iron" "90" "copper" "30" "silver" "10" "gold" "4" } }
                "9" { "upgrade_cost" { "wood" "160" "iron" "110" "copper" "40" "silver" "15" "gold" "6" } }
                "10" { "upgrade_cost" { "wood" "200" "iron" "150" "copper" "50" "silver" "20" "gold" "10" } }
            }
        }
    }
    "BuildRecipes"
    {
        "build_workbench"
        {
            "enabled" "1"
            "output_type" "合成台"
            "display_name" "合成台"
            "cost" { "wood" "50" "iron" "20" "copper" "5" }
        }
    }
}
