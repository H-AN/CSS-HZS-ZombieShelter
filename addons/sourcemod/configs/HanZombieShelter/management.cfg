"ShelterManagement"
{
    "schema_version" "1"
    "design_revision" "2.0"
    "Limits"
    {
        // Global logical defenses, excluding bases. Each base also has a quota.
        "max_total_buildings" "768"
    }
    "Dismantle"
    {
        // 只退实际支付的建造/升级材料；战斗摧毁、地雷爆炸不退。
        "refund_enabled" "1"
        "refund_fraction" "0.5"
        // 管理员拆除：返给在线原主人；无主则进入固定归属基地仓库。
        "admin_refund_to_owner" "1"
    }
    "Disconnect"
    {
        // 自动入仓优先当前基地，否则最近存活基地，最后任意基地。
        // 仓库容量不足先分流到其他基地，剩余进入共享待入仓队列；不回到个人。
        "announce_transfer" "1"
    }
}
