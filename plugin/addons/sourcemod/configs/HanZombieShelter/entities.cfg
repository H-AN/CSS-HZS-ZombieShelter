// 所有数量为网络实体(edict)，不是实体索引的最高编号。
"ShelterEntities"
{
    "schema_version" "1"
    "design_revision" "2.0"
    "Budget"
    {
        // 建造上限=min(该值,引擎上限-下方动态预留)，绝不贴近2048。
        // Default 1500. Values such as 2000 are clamped to the hard limit 1800.
        "construction_ceiling" "1500"
        "minimum_reserved_edicts" "248"
        // 按服务器最大玩家槽位预留，而不是当前在线人数。
        "reserve_per_player_slot" "4"
        // 主体一只NPC有身体/外观两个实体，额外预留一整轮替换空间。
        "reserve_per_native_npc" "2"
        "transient_reserve" "64"
        // 基地/采集物重建仍不得使用这最后248个实体。
        "critical_headroom" "248"
        "warning_interval_seconds" "30"
    }
}
