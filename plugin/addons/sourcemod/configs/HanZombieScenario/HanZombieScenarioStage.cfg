// HanZombieScenario 关卡配置文件
// 每个 Stage 表示一个关卡，字段说明如下：
// count:            本关卡所需击杀丧尸数量
// healthboost:      该关卡给予所有丧尸的额外血量加成
// zombie:           本关卡可生成的丧尸类型名称（多个用英文逗号分隔，对应 ZombieConfig 中的配置项）
// maxszombiecount:  本关特殊丧尸额外生成数量
// specialzombie:    本关卡可生成的特殊丧尸丧尸类型名称（多个用英文逗号分隔，对应 ZombieConfig 中的配置项）
// storyline:        本关卡的剧情提示，可用于显示在 HUD 或聊天中
// customzombies:    (可选) 填写特殊丧尸额外生成 丧尸1:数量,丧尸2:数量 将额外生成

"Stage"
{
    "Stage1"
    {
        "count"         "50"
        "healthboost"   "100"
        "zombie"        "putong_stage1"
        "maxszombiecount"        "0"
        "specialzombie"        "putong_stage1"
        "storyline"     "不明病毒爆发，灭杀小队请立即出动！"
    }

    "Stage2"
    {
        "count"         "80"
        "healthboost"   "200"
        "zombie"        "putong_stage1,zombie_lite"
        "maxszombiecount"        "0"
        "specialzombie"        "putong_stage1"
        "storyline"     "敌人变异升级，小队成员请注意！"
    }
}
