"ShelterPower"
{
    "schema_version" "1"
    "Rules" { "enabled" "1" 
        "overload_penalty" "0"
    }
    // Separate grids per base. Lower power_priority first, then oldest UID.
    // A consumer needs its whole power_required load; no batteries or fuel.
    "Limits" { "max_lights" "16" "max_projectiles" "24" }
}
