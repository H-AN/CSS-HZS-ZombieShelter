// v0.8.0, session-latched. Invalid/unknown fields are rejected; changed values
// require a new map session. Accounts remain in memory only for the current map.
// enabled: 0/1. points_per_day: 0..1000000, awarded once per NEW highest day.
// sm_zsh_skill_points_per_day -1 follows this config; 0 pauses future awards;
// 1..1000000 overrides future awards. Prior days are never recalculated.
// The cvar resets to -1 on a new map session, as do all map-only accounts.
// max_level: 1..1000; point_cost: 1..1000000; total spend must fit 2e9.
// amount_per_level: nonnegative finite; HP/armor amounts are whole units.
// Speed amount is fractional (0.01 = +1%); total <=2. Gravity is scalar
// subtraction (total <=10), hard floor 0.1, zero level preserves baseline.
// Purchase caps also stop at the actual gravity floor or immunity chance cap;
// Defaults: 2 points/day, 20 levels for ordinary skills, 1 point/level.
// Gravity uses the personal SetEntityGravity multiplier: raw 0 means unset,
// effective 1.0. Nine levels at -0.1 reach 0.1; a true 0.8 baseline caps at 7.
// With 2 points/day the 30-day budget is 60: three ordinary skills at level 20.
// These are editable release defaults, not fixed values in the plugin.
// Gather multiplier addition total <=1000; tool original zero stays disabled.
// Immunity probability: 0..1, capped by chance_cap, only valid Exposure damage.
// Pulse interval: 1..3600 seconds, radius: 1..8192 three-dimensional units.
// Other amounts total <=1e6. Amount zero means no contribution.
// Medic/logistics exclude their caster; all casters pulse independently.
// Artisan includes living completed bases/campfires, never construction.
// Respec: each registered material ID required, cost 0..2e9 from personal bag.
"ShelterSkills"
{
    "schema_version" "1"
    "Rules"
    {
        "enabled" "1"
        "points_per_day" "2"
    }
    "Skills"
    {
        "gather" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "0.05" }
        "repair" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "5" }
        "construct" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "5" }
        "speed" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "0.04" }
        "gravity" { "enabled" "1" "max_level" "9" "point_cost" "1" "amount_per_level" "0.1" }
        "immunity" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "0.02" "chance_cap" "0.40" }
        "medic" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "2" "radius_units" "256" "interval_seconds" "60" }
        "logistics" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "2" "radius_units" "256" "interval_seconds" "60" }
        "artisan" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "10" "radius_units" "256" "interval_seconds" "60" }
        "selfheal" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "2" "interval_seconds" "30" }
        "selfarmor" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "2" "interval_seconds" "30" }
        "maxhp" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "5" }
        "maxarmor" { "enabled" "1" "max_level" "20" "point_cost" "1" "amount_per_level" "5" }
    }
    "Respec"
    {
        "wood" "50"
        "iron" "20"
        "copper" "5"
        "silver" "0"
        "gold" "0"
        "plague_core" "0"
        "credits" "0"
    }
}
