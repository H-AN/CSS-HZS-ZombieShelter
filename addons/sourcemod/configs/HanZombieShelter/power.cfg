"ShelterPower"
{
    "schema_version" "1"
    "Rules" { "enabled" "1" "overload_penalty" "0" }
    // Separate grids per base. overload_penalty 0: lower power_priority first,
    // then oldest UID. 1: demand above actual output stops every positive load.
    // sm_zsh_power_overload -1 follows this file; 0/1 overrides it immediately.
    // A consumer needs its whole power_required load; no batteries or fuel.
    "Limits" { "max_lights" "16" "max_projectiles" "24" }
}
