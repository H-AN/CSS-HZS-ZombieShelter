// Absolute HP per building hit and multiplier per valid resource hit.
// gather_multiplier: 0..1000, up to 3 decimals; omitted = 1.0; 0 disables gathering.
// Fractions accumulate per connected player/material. Work requires the active slot-2 knife.
// Weapon creation and attack timing belong
// entirely to the external weapon system; this plugin does not create or probe
// a classname. Only an eligible slot-2 knife may fall back to weapon_knife below.
// Guns and delayed gun/grenade hits never gather, construct or repair.
// Hot reload only this table: sm_zsh_reload_weapons (ROOT).
"ShelterWeapons"
{
    "schema_version" "1"
    "Weapons"
    {
        "default_knife"
        {
            "classname" "weapon_knife"
            "repair_hp_per_hit" "10"
            "construction_hp_per_hit" "10"
            "gather_multiplier" "1.0"
        }
    }
}
