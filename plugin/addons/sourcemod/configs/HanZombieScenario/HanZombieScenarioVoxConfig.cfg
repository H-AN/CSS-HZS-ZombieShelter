// ScenarioVoxConfig 音效播报系统配置文件 填写音效路径
//  多个音效用 , 隔开
//  CountDownVox_Path 必须按顺序 1- n 填写 用 ,隔开 填写任意数量 倒计时会自动从最后一个倒数至第一个
// enable_vox 是否开启音效系统 1 为开启 0 为关闭
// RoundStartVox_Path 填写音乐路径用于回合开始播放音乐
// TwentysVox_Path 填写20秒提示
// CountDownVox_Path 填写倒计时音效
// ZombieComeingVox_Path 填写游戏开始音效
// HumanWinsVox_Path 填写人类胜利音效
// ZombieWinsVox_Path 填写丧尸胜利音效
// WinsBgmVox_Path 填写人类胜利BGM
// lostBgmVox_Path 填写人类失败BGM
"ScenarioVoxConfig"
{
    "enable_vox"    "1"
    "TwentysVox_Path"           "music/zombie_scenario_TwentysVox.mp3"
    "RoundStartVox_Path"           "music/zombie_scenario_start.mp3"
    "CountDownVox_Path"              "music/zombie_scenario_sCountDown.mp3"
    "ZombieComeingVox_Path"          "music/zombie_scenario_ZombieComeing.mp3"
    "HumanWinsVox_Path"    "music/zombie_scenario_HumanWins.mp3"
    "ZombieWinsVox_Path"    "music/zombie_scenario_ZombieWins.mp3"
    "WinsBgmVox_Path"    "music/zombie_scenario_WinsBgmVox.mp3"
    "lostBgmVox_Path"    "music/zombie_scenario_lostBgmVox.mp3"
}
