// 每次操作只执行一次配方：从个人背包扣除 cost，再将 output 全额放入个人背包。
// 任意类型及等级的已完工合成台均可使用材料配方，不绑定武器配方的台名/等级。
// 输入材料不足或产出放不下时整次交易拒绝，不扣材料、不截断产出。
"ShelterMaterialCrafting"
{
    "schema_version" "1"
    "Recipes"
    {
        "wood_to_iron"
        {
            "display_name" "木材合成铁"
            "cost" { "wood" "100" }
            "output" { "material" "iron" "amount" "1" }
        }
        "iron_to_copper"
        {
            "display_name" "铁合成铜"
            "cost" { "iron" "100" }
            "output" { "material" "copper" "amount" "1" }
        }
        "copper_to_silver"
        {
            "display_name" "铜合成银"
            "cost" { "copper" "100" }
            "output" { "material" "silver" "amount" "1" }
        }
        "silver_to_gold"
        {
            "display_name" "银合成金"
            "cost" { "silver" "100" }
            "output" { "material" "gold" "amount" "1" }
        }
        // 多材料合成起始方案，可由服主调整；不代表已通过实战经济平衡验收。
        "plague_core"
        {
            "display_name" "瘟疫核心合成"
            "cost" { "gold" "10" "silver" "20" "credits" "5" }
            "output" { "material" "plague_core" "amount" "1" }
        }
    }
}
